      else if (k === 'para') box.innerHTML = lab + '<textarea id="' + id + '" name="' + id + '"></textarea>';
      else if (k === 'date') box.innerHTML = lab + '<input type="date" id="' + id + '" name="' + id + '"' + (/compilazione/i.test(t) ? ' value="' + oggi + '"' : '') + '>';
      else if (k === 'sel') box.innerHTML = lab + '<select id="' + id + '" name="' + id + '"><option value="">Scegli</option>' + a.map(function (o) { return '<option>' + esc(o) + '</option>'; }).join('') + '</select>';
      else {
        var opts = k === 'sn' ? ['SI', 'NO'].concat(Array.isArray(a) ? a : []) : a, type = k === 'cb' ? 'checkbox' : 'radio';
        box.innerHTML = '<label class="t">' + esc(t) + (req ? ' <span class="req">*</span>' : '') + '</label><div class="opts">' + opts.map(function (o) {
          return '<label><input type="' + type + '" name="' + id + '" value="' + esc(o) + '"> ' + esc(o) + '</label>'; }).join('') + '</div>';
      }
    }
    boxes[t] = box; card.appendChild(box);
  });

  // Date in formato gg/mm/aaaa: si scrivono a mano oppure si scelgono dal calendario (al server va sempre aaaa-mm-gg)
  (function () {
    function iso2it(v) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || ''); return m ? m[3] + '/' + m[2] + '/' + m[1] : ''; }
    function it2iso(t) { var m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(t); if (!m) return ''; var d = +m[1], mo = +m[2], y = +m[3], x = new Date(y, mo - 1, d);
      if (y < 1900 || y > 2100 || x.getFullYear() !== y || x.getMonth() !== mo - 1 || x.getDate() !== d) return ''; return m[3] + '-' + m[2] + '-' + m[1]; }
    function mask(v) { var s = v.replace(/\D/g, '').slice(0, 8); return s.length > 4 ? s.slice(0, 2) + '/' + s.slice(2, 4) + '/' + s.slice(4) : s.length > 2 ? s.slice(0, 2) + '/' + s.slice(2) : s; }
    [].forEach.call(form.querySelectorAll('input[type=date]'), function (d) {
      var w = el('span', { 'class': 'dt' }), t = el('input', { type: 'text', 'class': 'dtxt', inputmode: 'numeric', placeholder: 'gg/mm/aaaa', maxlength: '10', autocomplete: 'off' });
      var c = el('span', { 'class': 'cal', title: 'Scegli dal calendario' }, '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>');
      var lab = d.parentNode.querySelector('label.t'); if (lab) { t.setAttribute('aria-label', lab.textContent.replace('*', '').trim() + ', formato gg/mm/aaaa'); } t.id = d.id + '_gg'; if (lab) lab.setAttribute('for', t.id);
      d.parentNode.insertBefore(w, d); w.appendChild(t); w.appendChild(c); c.appendChild(d); d.setAttribute('aria-label', 'Apri il calendario'); d.tabIndex = -1;
      t.addEventListener('input', function () { t.value = mask(t.value); d.value = it2iso(t.value); t.classList.toggle('bad', t.value.length === 10 && !d.value); });
      t.addEventListener('blur', function () { t.classList.toggle('bad', !!t.value && !d.value); });
      function sync() { t.value = iso2it(d.value); t.classList.remove('bad'); }
      d.addEventListener('change', sync); d.addEventListener('input', sync);
      d.addEventListener('click', function () { try { d.showPicker(); } catch (e) {} });
      if (d.value) sync();
    });
  })();

  var sig = el('section', { 'class': 'card', 'data-title': 'Firma' }, '<h2>Firma dell\'interessato</h2><div class="sub">Firmi con il dito (o con il mouse) nel riquadro, poi invii la scheda.</div>' +
    '<canvas id="pad" style="margin-top:10px"></canvas><button type="button" class="sec" id="clr" style="margin-top:8px">Cancella firma</button>');
  sig.style.setProperty('--c', '#1f7a4d'); form.appendChild(sig); cards.push(sig);
  var nav = el('div', { 'class': 'nav' }, '<p id="msg" class="err"></p><div class="btns"><button type="button" class="sec" id="prev">Indietro</button><button type="button" class="pri" id="next">Avanti</button></div>');
  form.appendChild(nav);
  var done = el('div', { 'class': 'card hid', id: 'done' }, '<p class="ok">Scheda inviata. Grazie.</p><p>La Sezione Sanitaria ha ricevuto la Sua scheda firmata. Può chiudere questa pagina.</p>');
  app.appendChild(done);

  function vals(b) {
    if (!b || b.closest('.hid')) return [];
    var out = [];
    [].forEach.call(b.querySelectorAll('input:not(.dtxt),select,textarea'), function (i) {
      if (i.type === 'radio' || i.type === 'checkbox') { if (i.checked) out.push(i.value); }
      else if (String(i.value).trim()) out.push(String(i.value).trim());
    });
    return out;
  }
  function apply() {
    var sv = vals(boxes['Sede di servizio'])[0] || '', st = !sv || sv === 'Altra sede' ? 'la propria sede di servizio' : sv;
    [].forEach.call(form.querySelectorAll('.dich'), function (n) { if (!n.hasAttribute('data-raw')) n.setAttribute('data-raw', n.textContent); var raw = n.getAttribute('data-raw'); if (raw.indexOf('{SEDE}') >= 0) n.textContent = raw.split('{SEDE}').join(st); });
    for (var pass = 0; pass < 4; pass++) {
      [].forEach.call(form.querySelectorAll('[data-se]'), function (n) {
        var want = JSON.parse(n.getAttribute('data-in')), v = vals(boxes[n.getAttribute('data-se')]);
        n.classList.toggle('hid', !v.some(function (x) { return want.indexOf(x) >= 0; }));
      });
    }
  }
  function collect(scope) {
    var data = {}, miss = [];
    [].forEach.call((scope || form).querySelectorAll('.q'), function (b) {
      if (b.closest('.hid')) return;
      var t = b.getAttribute('data-t'), v = vals(b).join(', ');
      if (v) data[t] = v;
      if (b.getAttribute('data-req') && !v) miss.push(t);
    });
    return { data: data, miss: miss };
  }


  var ERR = { codice: 'Codice non valido: controlla il codice ricevuto dalla Sezione.', scaduto: 'Codice scaduto: chiedi un nuovo codice alla Sezione.', usato: 'Questo codice è già stato usato per la scheda anamnestica: chiedi un nuovo codice alla Sezione.', occupato: 'Troppi tentativi: riprova tra qualche minuto.', campi: 'Mancano cognome o nome.', firma: 'Manca la firma nel riquadro.', errore: 'Invio non riuscito per un errore del servizio. Riprova tra qualche minuto.' };
  function fatto() { form.classList.add('hid'); head.classList.add('hid'); done.classList.remove('hid'); window.scrollTo(0, 0); }
  function stato() {
    var o = {};
    [].forEach.call(form.elements, function (x) {
      if (!x.name || x.classList.contains('dtxt')) return;
      if (x.type === 'radio') { if (x.checked) o[x.name] = x.value; }
      else if (x.type === 'checkbox') { if (x.checked) (o[x.name] = o[x.name] || []).push(x.value); }
      else if (String(x.value).trim()) o[x.name] = x.value;
    });
    return o;
  }
  function riempi(o) {
    [].forEach.call(form.elements, function (x) {
      if (!x.name || x.classList.contains('dtxt') || !Object.prototype.hasOwnProperty.call(o, x.name)) return;
      var v = o[x.name];
      if (x.type === 'radio') x.checked = x.value === v;
      else if (x.type === 'checkbox') x.checked = [].concat(v).indexOf(x.value) >= 0;
      else { x.value = v; if (x.type === 'date') x.dispatchEvent(new Event('change')); }
    });
    apply();
  }
  var altBox = null;
  function alternative(data, firma) {
    if (!altBox) { altBox = el('div', { 'class': 'card alt' }); form.insertBefore(altBox, nav); }
    altBox.innerHTML = '<h3>Due modi per completare l\'invio</h3><div class="altc">' +
      '<div class="altq"><b>1. Continua sul telefono</b><span>Inquadra il codice QR con la fotocamera del telefono, usando la rete mobile: la scheda si apre già compilata. Firma di nuovo e premi Invia la scheda.</span><img id="altqr" alt="Codice QR per aprire la scheda compilata sul telefono"><span class="qrno" hidden>La scheda ha troppi dati per il codice QR: usa l\'email.</span></div>' +
      '<div class="altm"><b>2. Invia per email</b><span>Il pulsante copia la scheda firmata e apre la tua posta con un messaggio già indirizzato alla Sezione. Nel testo del messaggio incolla (tasto destro e Incolla, oppure Ctrl+V) e premi Invia: riceverai una conferma.</span><button type="button" class="pri" id="altcopia">Copia la scheda e apri l\'email</button><a href="#" id="altfile">Se incollare non funziona: scarica il file e allegalo all\'email</a><span class="altnota">Se la posta non si apre, scrivi tu a ' + EMAIL_SEZ + ' con oggetto <b>Invio scheda anamnestica ' + esc(window.CODICE_SEZ || '') + '</b> e incolla la scheda nel testo.</span><textarea id="alttesto" readonly hidden aria-label="Testo della scheda da copiare"></textarea></div></div>';
    var cod = window.CODICE_SEZ || '';
    comprimi(JSON.stringify(stato())).then(function (z) {
      var url = location.origin + location.pathname + '?codice=' + encodeURIComponent(cod) + '#s=' + z, img = document.getElementById('altqr');
      try { if (url.length > 2900) throw new Error('lungo'); var q = qrcode(0, 'L'); q.addData(url, 'Byte'); q.make(); img.src = q.createDataURL(4, 12); }
      catch (e) { img.hidden = true; altBox.querySelector('.qrno').hidden = false; }
    });
    var t = u8b64(new TextEncoder().encode(JSON.stringify({ codice: cod, dati: data, firma: firma }))), righe = [];
    for (var i = 0; i < t.length; i += 76) righe.push(t.slice(i, i + 76));
    var testo = 'INIZIO SCHEDA ANAMNESTICA\n' + righe.join('\n') + '\nFINE SCHEDA ANAMNESTICA\n', ogg = 'Invio scheda anamnestica ' + cod;
    function posta(corpo) { location.href = 'mailto:' + EMAIL_SEZ + '?subject=' + encodeURIComponent(ogg) + '&body=' + encodeURIComponent(corpo); }
    document.getElementById('altcopia').onclick = function () {
      function apri() { posta('Incolla qui sotto la scheda copiata dalla pagina, poi premi Invia.\n\n'); }
      function manuale() { var ta = document.getElementById('alttesto'); ta.hidden = false; ta.value = testo; ta.focus(); ta.select(); try { document.execCommand('copy'); } catch (e) {} apri(); }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(testo).then(apri, manuale); else manuale();
    };
    document.getElementById('altfile').onclick = function (e) {
      e.preventDefault();
      var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([testo], { type: 'text/plain' })); a.download = 'scheda_anamnestica_' + cod + '.txt';
      document.body.appendChild(a); a.click(); a.parentNode.removeChild(a);
      setTimeout(function () { posta('Allego il file della scheda anamnestica.\n'); }, 800);
    };
    altBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  var cur = 0;
  function vis() { return cards.filter(function (c) { return !c.classList.contains('hid'); }); }
  function show(keep) {
    var vc = vis(); if (cur > vc.length - 1) cur = vc.length - 1; if (cur < 0) cur = 0;
    cards.forEach(function (c) { c.classList.add('off'); }); vc[cur].classList.remove('off');
    document.getElementById('prev').style.visibility = cur ? 'visible' : 'hidden';
    var last = cur === vc.length - 1, nb = document.getElementById('next');
    nb.textContent = last ? 'Invia la scheda' : 'Avanti'; nb.className = last ? 'pri send' : 'pri';
    document.getElementById('pbar').style.width = Math.round((cur + 1) * 100 / vc.length) + '%';
    document.getElementById('ptxt').textContent = 'Sezione ' + (cur + 1) + ' di ' + vc.length + ': ' + vc[cur].getAttribute('data-title');
    document.getElementById('msg').textContent = '';
    if (vc[cur] === sig) size();
    if (!keep) window.scrollTo(0, 0);
  }
  form.addEventListener('change', function () { var now = vis()[cur]; apply(); var i = vis().indexOf(now); if (i >= 0) cur = i; show(true); });

  var pad = document.getElementById('pad'), ctx = null, drawing = false, signed = false;
  function size() {
    var r = pad.getBoundingClientRect(); if (!r.width) return;
    var d = window.devicePixelRatio || 1, old = signed ? pad.toDataURL() : null;
    pad.width = r.width * d; pad.height = r.height * d; ctx = pad.getContext('2d'); ctx.scale(d, d);
    ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0a1a3a'; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, r.width, r.height);
    if (old) { var im = new Image(); im.onload = function () { ctx.drawImage(im, 0, 0, r.width, r.height); }; im.src = old; }
  }
  window.addEventListener('resize', size);
  function pos(e) { var r = pad.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  pad.addEventListener('pointerdown', function (e) { if (!ctx) size(); drawing = true; pad.setPointerCapture(e.pointerId); var p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); });
  pad.addEventListener('pointermove', function (e) { if (!drawing) return; var p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); signed = true; e.preventDefault(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) { pad.addEventListener(ev, function () { drawing = false; }); });
  document.getElementById('clr').addEventListener('click', function () { signed = false; var r = pad.getBoundingClientRect(); if (ctx) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, r.width, r.height); } });

  document.getElementById('prev').addEventListener('click', function () { cur--; show(); });
  document.getElementById('next').addEventListener('click', function () {
    var msg = document.getElementById('msg'), vc = vis(), r = collect(vc[cur]);
    if (r.miss.length) { msg.textContent = 'Mancano: ' + r.miss.join('; '); return; }
    if (cur < vc.length - 1) { cur++; show(); return; }
    var all = collect();
    if (all.miss.length) { msg.textContent = 'Mancano: ' + all.miss.join('; '); return; }
    if (!signed) { msg.textContent = 'Manca la firma nel riquadro.'; return; }
    var btn = this; btn.disabled = true; btn.textContent = 'Invio in corso'; msg.textContent = '';
    var firma = pad.toDataURL('image/png');
    invia({ azione: 'salva', codice: window.CODICE_SEZ || '', dati: JSON.stringify(all.data), firma: firma }).then(function (r) {
      if (r && r.ok) { fatto(); return; }
      btn.disabled = false; btn.textContent = 'Invia la scheda';
      msg.textContent = (ERR[r && r.err] || ERR.errore) + (r && r.err === 'errore' && r.msg ? ' (' + r.msg + ')' : '');
    }).catch(function () {
      btn.disabled = false; btn.textContent = 'Riprova l\'invio';
      msg.textContent = 'Invio non riuscito: la rete che stai usando (per esempio quella dell\'ufficio) blocca il servizio della Sezione. Usa una delle due soluzioni qui sopra.';
      alternative(all.data, firma);
    });
  });
  apply(); show();
  if (PRECOMP) PRECOMP.then(function (o) {
    if (!o) return;
    riempi(o);
    head.appendChild(el('p', { 'class': 'prefill' }, 'Scheda compilata dall\'altro dispositivo: controlla le risposte, firma nel riquadro e premi Invia la scheda.'));
    cur = vis().length - 1; show();
  });
}

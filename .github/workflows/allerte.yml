name: Allerte e meteo
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: allerte
  cancel-in-progress: false
jobs:
  allerte:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Scarica le allerte IRM per l'Hainaut
        run: |
          python3 - <<'PY'
          import json, urllib.request, datetime, sys
          FEED = "https://feeds.meteoalarm.org/api/v1/warnings/feeds-belgium"
          ZONA = "BE32"
          import time
          req = urllib.request.Request(FEED, headers={"User-Agent": "guida-sanitaria-shape"})
          d = None
          for prova in range(4):
              try:
                  d = json.load(urllib.request.urlopen(req, timeout=40))
                  break
              except Exception as e:
                  print("feed MeteoAlarm non raggiungibile, tentativo", prova + 1, ":", e)
                  time.sleep(15 * (prova + 1))
          if d is None:
              print("::warning::MeteoAlarm non risponde: resta il file allerte.json precedente, riprovo al prossimo giro")
              sys.exit(0)
          ora = datetime.datetime.now(datetime.timezone.utc)
          lim = ora + datetime.timedelta(hours=48)
          out = []
          for w in d.get("warnings", []):
              a = w.get("alert", {})
              if a.get("status") != "Actual" or a.get("msgType") == "Cancel":
                  continue
              info = [i for i in a.get("info", []) if i.get("language", "").startswith("fr")]
              for i in info:
                  if not any(g.get("value") == ZONA for ar in i.get("area", []) for g in ar.get("geocode", [])):
                      continue
                  P = {p["valueName"]: p["value"] for p in i.get("parameter", [])}
                  try:
                      liv = int(P["awareness_level"].split(";")[0]); tipo = int(P["awareness_type"].split(";")[0])
                      on = datetime.datetime.fromisoformat(i.get("onset") or i["effective"]); ex = datetime.datetime.fromisoformat(i["expires"])
                  except Exception:
                      continue
                  if ex <= ora or on > lim:
                      continue
                  desc = (i.get("description") or "").strip()
                  if desc.lower().startswith("aucune"):
                      desc = ""
                  out.append({"s": a.get("sent", ""), "t": tipo, "l": liv, "o": on.isoformat(), "e": ex.isoformat(), "d": desc[:600]})
          out.sort(key=lambda x: (x["o"], x["t"], x["s"]))
          json.dump({"giorno": ora.astimezone(datetime.timezone(datetime.timedelta(hours=1))).date().isoformat(), "zona": "Hainaut", "fonte": "IRM tramite MeteoAlarm", "m": out}, open("allerte.json", "w"), ensure_ascii=False, separators=(",", ":"))
          print(len(out), "messaggi")
          PY
      - name: Scarica il meteo di SHAPE (Open Meteo, riserva met.no), cosi i telefoni non chiamano servizi esterni
        run: |
          python3 - <<'PY'
          import json, urllib.request, datetime, time
          UA = {"User-Agent": "guida-sanitaria-shape github.com/shapeitaliansansection"}
          ora = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds")
          def leggi(url):
              return json.load(urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=25))
          def open_meteo():
              j = leggi("https://api.open-meteo.com/v1/forecast?latitude=50.502&longitude=3.983"
                        "&current=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min"
                        "&forecast_days=1&timezone=Europe%2FBrussels")
              c = j["current"]; dl = j.get("daily", {})
              return {"t": c["temperature_2m"], "c": c["weather_code"], "g": c["is_day"],
                      "mx": (dl.get("temperature_2m_max") or [None])[0], "mn": (dl.get("temperature_2m_min") or [None])[0], "fonte": "Open Meteo"}
          # met.no: i simboli vengono convertiti nei codici meteo usati dal sito
          SIMB = [("thunder", 95), ("snow", 71), ("sleet", 66), ("rainshowers", 80), ("heavyrain", 65), ("lightrain", 61), ("rain", 63),
                  ("fog", 45), ("partlycloudy", 2), ("cloudy", 3), ("fair", 1), ("clearsky", 0)]
          def met_no():
              j = leggi("https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=50.502&lon=3.983")
              ts = j["properties"]["timeseries"]; d0 = ts[0]["data"]
              sym = ((d0.get("next_1_hours") or d0.get("next_6_hours") or {}).get("summary") or {}).get("symbol_code", "cloudy")
              cod = next((v for k, v in SIMB if k in sym), 3)
              oggi = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=1))).date().isoformat()
              temps = [x["data"]["instant"]["details"]["air_temperature"] for x in ts
                       if datetime.datetime.fromisoformat(x["time"].replace("Z", "+00:00")).astimezone(datetime.timezone(datetime.timedelta(hours=1))).date().isoformat() == oggi]
              return {"t": d0["instant"]["details"]["air_temperature"], "c": cod, "g": 0 if sym.endswith("_night") else 1,
                      "mx": max(temps) if temps else None, "mn": min(temps) if temps else None, "fonte": "met.no"}
          out = None
          for fonte in (open_meteo, open_meteo, met_no, met_no):
              try:
                  out = fonte(); break
              except Exception as e:
                  print("::warning::meteo non scaricato da", fonte.__name__, ":", e); time.sleep(10)
          if out:
              out["ts"] = ora
              json.dump(out, open("meteo.json", "w"), ensure_ascii=False, separators=(",", ":"))
              print("meteo", out["t"], "da", out["fonte"])
          else:
              print("::warning::meteo non aggiornato: resta il file precedente")
          PY
      - name: Salva se sono cambiate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add allerte.json meteo.json
          if git diff --cached --quiet; then echo "Nessuna novità"; exit 0; fi
          git commit -m "Allerte e meteo aggiornati"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            echo "invio non riuscito, riprovo"; sleep 10
          done
          exit 1
